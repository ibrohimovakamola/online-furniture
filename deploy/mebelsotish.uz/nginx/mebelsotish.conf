# mebelsotish.uz — Nginx (VPS)
# Install: sudo cp deploy/mebelsotish.uz/nginx/mebelsotish.conf /etc/nginx/sites-available/mebelsotish.uz
#          sudo ln -sf /etc/nginx/sites-available/mebelsotish.uz /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Paths: adjust `root` to match your dist upload directory.

upstream exclusive_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mebelsotish.uz www.mebelsotish.uz;

    # Let's Encrypt HTTP-01 challenge (certbot --nginx / --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://mebelsotish.uz$request_uri;
    }
}

# ── www → apex (HTTPS) ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mebelsotish.uz;

    ssl_certificate     /etc/letsencrypt/live/mebelsotish.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mebelsotish.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mebelsotish.uz$request_uri;
}

# ── Primary site (HTTPS) ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mebelsotish.uz;

    ssl_certificate     /etc/letsencrypt/live/mebelsotish.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mebelsotish.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling (A+ on SSL Labs)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/mebelsotish.uz/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers (match Apache .htaccess)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/mebelsotish.uz/html;
    index index.html;

    client_max_body_size 12M;

    # ── API (Express on 127.0.0.1:5000) ──
    location /api/ {
        proxy_pass http://exclusive_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ── Uploaded product images ──
    location /uploads/ {
        proxy_pass http://exclusive_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── React SPA ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
