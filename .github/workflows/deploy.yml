name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build:prod
        env:
          VITE_API_BASE_URL: https://mebelsotish.uz/api
          VITE_SERVER_URL: https://mebelsotish.uz

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_FRONTEND_PATH: ${{ secrets.DEPLOY_FRONTEND_PATH }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "Skipping deploy: set DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER repository secrets."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          FRONTEND="${DEPLOY_FRONTEND_PATH:-public_html}"
          APP="${DEPLOY_APP_PATH:-exclusive}"

          echo "Uploading dist/ → ${DEPLOY_USER}@${DEPLOY_HOST}:${FRONTEND}/"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${FRONTEND}/"

          echo "Updating API and restarting PM2..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
             cd ~/${APP}
             git pull origin main
             npm ci
             npm ci --prefix server --omit=dev
             npm run migrate --if-present
             pm2 restart mebel-api || pm2 start pm2.config.cjs --env production
             pm2 save"
